name: Price monitoring

# Calls the app's monitoring endpoint on a schedule. This supplements
# Vercel Cron, which on the Hobby plan only runs once per day.
#
# Setup (one time): GitHub repo → Settings → Secrets and variables →
# Actions → New repository secret → name: CRON_SECRET, value: the same
# secret configured in Vercel.
on:
  schedule:
    - cron: "37 */6 * * *" # every 6 hours, 30 min after each scrape — re-evaluates alerts against the fresh fares
  workflow_dispatch: {} # allows manual runs from the Actions tab

jobs:
  check-prices:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger price monitoring
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: https://amtrak-price-watch-ten.vercel.app
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::CRON_SECRET repository secret is not set — skipping."
            exit 0
          fi
          status=$(curl -sS -o response.json -w "%{http_code}" --max-time 240 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron/check-prices")
          echo "HTTP status: $status"
          echo "Response: $(cat response.json)"
          if [ "$status" != "200" ]; then
            case "$status" in
              401) echo "::error::Unauthorized — the CRON_SECRET here doesn't match the one the deployed app is running with. Update both and REDEPLOY on Vercel (env changes need a new deployment)." ;;
              500) echo "::error::Server error — check the response above and Vercel Logs. If it says CRON_SECRET is not configured, set it in Vercel and redeploy." ;;
              *)   echo "::error::Unexpected status $status — see response above." ;;
            esac
            exit 1
          fi
